<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大成的 Fromm 留言筐</title>
<style>
:root{--bg:#F6EAD3;--paper:#FFFBF1;--line:#EADFC4;--basket:#D7A465;--basket-d:#B37F42;--o1:#F4A23C;--o2:#EE8C2A;--o3:#E97A1F;--leaf:#8FAE68;--leaf-d:#6D8C4C;--ink:#4B3A29;--soft:#8A7358;--faint:#A8957A;--shadow:rgba(75,58,42,.16);
--hand:"Kaiti SC","STKaiti","KaiTi","楷体","Noto Serif SC","Songti SC",serif;--sans:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#241C14;--paper:#332A1F;--line:#463A29;--basket:#8C6437;--basket-d:#6E4C28;--o1:#EFA24A;--o2:#DE8A2E;--o3:#C97321;--leaf:#7DA059;--leaf-d:#5E7C41;--ink:#F1E4CD;--soft:#C9B692;--faint:#8B795C;--shadow:rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.app{max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:32px 20px 40px;text-align:center}
.hidden{display:none!important}
h1{font-family:var(--hand);font-weight:700;font-size:30px;margin:4px 0 6px;letter-spacing:2px}
.sub{font-size:13px;color:var(--soft);margin:0 0 14px}
.stage{width:100%;max-width:400px;margin:0 auto}
.stage svg{width:100%;display:block;overflow:visible}
.bo{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .18s}
.bo:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
@media (hover:hover){.bo:hover{transform:translateY(-6px) rotate(-4deg)}}
.bo.lift{animation:lift .4s ease-in forwards}
@keyframes lift{to{transform:translateY(-90px) scale(1.2);opacity:0}}
.pick{font-family:var(--hand);font-weight:700;font-size:22px;letter-spacing:2px;background:var(--o2);color:#fff9ee;border:none;border-radius:999px;padding:12px 44px;margin:14px 0 12px;cursor:pointer}
.pick:disabled{opacity:.5}
.pick:active{transform:scale(.97)}
.count{font-size:13px;color:var(--soft);margin:0}
.count b{color:var(--ink)}
.tabs{display:flex;gap:10px;justify-content:center;margin-top:28px}
.tabs button,.back{font:inherit;font-size:13px;color:var(--soft);background:none;border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(36,28,20,.55);display:flex;align-items:center;justify-content:center;padding:24px;z-index:40;overflow-y:auto}
#pickov svg{width:180px;height:180px;animation:pop .85s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes pop{0%{transform:scale(.4) rotate(-8deg);opacity:0}50%{transform:scale(1.15) rotate(6deg);opacity:1}100%{transform:scale(1)}}
.card{width:100%;max-width:340px;background:var(--paper);border-radius:8px;padding:26px 24px 20px;box-shadow:0 18px 40px var(--shadow);position:relative;text-align:left;animation:cin .35s cubic-bezier(.2,.8,.3,1.1)}
@keyframes cin{from{transform:scale(.88) rotate(-1.5deg);opacity:0}}
.date{font-family:var(--hand);font-weight:700;font-size:22px;color:var(--o3);display:flex;align-items:center;gap:8px;margin:0 0 10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.date svg{width:22px;height:22px}
.txt{font-family:var(--hand);font-size:17px;line-height:1.85;max-height:52vh;overflow-y:auto}
.txt p{margin:0 0 .55em}
.txt .tag{color:var(--soft);font-size:14px;font-family:var(--sans)}
.end{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);color:var(--o3);text-align:center;font-family:var(--hand);font-size:17px;line-height:1.8}
.acts{display:flex;gap:10px;margin-top:18px}
.acts button{flex:1;font:inherit;font-size:13px;padding:11px 8px;border-radius:999px;cursor:pointer;border:1px solid var(--line);background:none;color:var(--soft)}
.acts .pri{background:var(--o2);color:#fff9ee;border:none}
.x{position:absolute;top:8px;right:10px;background:none;border:none;font-size:18px;color:var(--faint);cursor:pointer;padding:6px}
.box{background:var(--paper);border-radius:14px;padding:24px;max-width:320px;width:100%;position:relative;text-align:left}
.box h3{font-family:var(--hand);font-size:20px;margin:0 0 10px}
.box p{font-size:13px;line-height:1.8;color:var(--soft);margin:0 0 8px}
.box img{width:100%;border-radius:6px;display:block}
.box a{display:block;text-align:center;font-size:13px;color:var(--o3);margin-top:8px}
.ah{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:12px;color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cell{aspect-ratio:1;border-radius:12px;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;padding:0;font:inherit}
button.cell{cursor:pointer}
.cell svg{width:62%;height:62%;margin-bottom:8px}
.cell.lk svg{filter:grayscale(1);opacity:.25}
.cell span{position:absolute;bottom:6px;left:0;right:0;font-size:11px;color:var(--soft)}
.face{font-family:var(--hand);font-size:22px;line-height:1.7;margin:4px 0 6px}
.q{font-size:13px;color:var(--soft);border-left:2px solid var(--line);padding-left:10px;margin:0 0 10px}
.gt{font-size:12px;color:var(--o3);margin:0 0 6px}
.more{font:inherit;font-size:12.5px;color:var(--soft);background:none;border:none;padding:6px 0;margin-top:8px;cursor:pointer;text-decoration:underline dotted}
.full{margin-top:8px}
.full h4{font:inherit;font-size:12px;color:var(--faint);margin:0 0 8px}
.bub{display:block;width:fit-content;max-width:100%;background:var(--bg);border-radius:12px 12px 12px 3px;padding:8px 12px;margin:0 0 10px}
.bub p{margin:0}
.gold,#pickov.gold svg,.cell.g svg{--o1:#F2CB5C;--o2:#E9B93F;--o3:#C8962A}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>

</svg>
</div>
<button class="pick" id="pick">摘一个橙子</button>

</div>

</div>

<div class="ov hidden" id="aboutov"><div class="box">
<button class="x" id="ax" aria-label="关闭">✕</button>
<h3>关于大成的留言筐</h3>
<p>从没想过要告别，也不知道如何告别，更不知道如何珍藏与你在这小小树洞一起经历过的细腻、明亮而又短暂的125天。</p>
<p>于是就把 Fromm 上的一段段日常留言，变成了一筐可以慢慢摘下来的橙子。是过往的回忆，更是当下的惊喜。</p>
<p>摘过的橙子会留在“回忆果园”里，随时回去看，不过进度只保存在这台设备中哦！</p>
<p>祝你摘到让自己惊喜的那一颗。</p>
</div></div>

<div class="ov hidden" id="imgov"><div class="box">
<button class="x" id="ix" aria-label="关闭">✕</button>
<img id="oimg" alt="留言图片">
<p style="text-align:center;margin-top:10px">长按图片，保存到相册</p>
<a id="dl" download="橙子回忆.png">电脑上点这里下载</a>

<script>
(function(){
/* 聊天记录格式：
四位数字（月日）单独一行 = 新的一天
空行 = 分隔他回给不同人的话（每段显示成一个气泡）
行首 * = 这一天的“金句”，做卡面大字（不标就用第一句）
行首 > = 他回给你的那一天，后面可写你当时说的话（可留空）；带这行的日子会变成金橙子 */
var DATA = `

var days=[],cur=null,grp=null;
DATA.split('\n').forEach(function(l){l=l.trim();
if(!l){grp=null;return;}
if(/^\d{4}$/.test(l)){cur={id:l,groups:[],face:'',gold:false};days.push(cur);grp=null;return;}
if(!cur)return;
if(!grp){grp={lines:[],quote:null};cur.groups.push(grp);}
if(l[0]==='>'){grp.quote=l.slice(1).trim();cur.gold=true;return;}
var star=l[0]==='*';if(star)l=l.slice(1).trim();
grp.lines.push(l);
if(star&&!cur.face)cur.face=l;
});
days.forEach(function(d){d.all=[];d.groups.forEach(function(g){d.all=d.all.concat(g.lines);});if(!d.face)d.face=d.all[0]||'';});
days.sort(function(a,b){return a.id<b.id?-1:1;});
var N=days.length,KEY='orange-basket-fromm-v2',busy=false,now=null;
var FONT='"Kaiti SC","STKaiti","KaiTi","楷体","Songti SC",serif';

var st={collected:[]};
try{var r=JSON.parse(localStorage.getItem(KEY));if(r&&Array.isArray(r.collected))st=r;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
function $(id){return document.getElementById(id);}
function byId(id){return days.filter(function(d){return d.id===id;})[0];}
function fmt(id){return parseInt(id.slice(0,2),10)+'月'+parseInt(id.slice(2),10)+'日';}
function esc(s){return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function rich(l){var m=/^(【[^】]*】)(.*)$/.exec(l);return m?'<span class="tag">'+esc(m[1])+'</span>'+(m[2]?'<br>'+esc(m[2]):''):esc(l);}
function show(id){$(id).classList.remove('hidden');}
function hide(id){$(id).classList.add('hidden');}

$('tc').textContent=N;
function count(){$('cc').textContent=st.collected.length;}

/* 筐里的橙子 */
var POS=[[97,150,-10,.74],[303,150,10,.74],[120,110,-8,.78],[165,90,5,.85],[235,88,-6,.88],[280,108,9,.8],[150,135,-5,.82],[200,120,3,.95],[250,135,7,.82],[140,168,-9,.78],[200,180,4,.8],[260,168,-7,.78]];
$('pile').innerHTML=POS.map(function(p){
return '<g transform="translate('+p[0]+','+p[1]+') rotate('+p[2]+') scale('+p[3]+')"><g class="bo" tabindex="0" role="button" aria-label="摘一个橙子"><use href="#o"/></g></g>';
}).join('');
$('pile').addEventListener('click',function(e){var t=e.target.closest('.bo');if(t)pick(t);});
$('pile').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){var t=e.target.closest('.bo');if(t){e.preventDefault();pick(t);}}});

function choose(){
var left=days.filter(function(d){return st.collected.indexOf(d.id)<0;});
var pool=left.length?left:days;
return pool[Math.floor(Math.random()*pool.length)].id;
}

function pick(el){
if(busy)return;busy=true;$('pick').disabled=true;
var id=choose(),os=document.querySelectorAll('.bo');
el=el||os[Math.floor(Math.random()*os.length)];
el.classList.add('lift');
setTimeout(function(){
var s=$('pickov').firstElementChild;s.style.animation='none';void s.getBoundingClientRect();s.style.animation='';
$('pickov').classList.toggle('gold',byId(id).gold);show('pickov');
},350);
setTimeout(function(){
hide('pickov');
var done=false;
if(st.collected.indexOf(id)<0){st.collected.push(id);save();count();done=st.collected.length===N;}
el.classList.remove('lift');
showResult(id,false,done);
busy=false;$('pick').disabled=false;
},1200);
}

function showResult(id,review,done){
now=byId(id);
$('dt').textContent=fmt(id);
var q=null,h='';
now.groups.forEach(function(g){if(g.quote!==null&&q===null)q=g.quote;});
if(now.gold)h+='<div class="gt">✦ 这天，他回给你了</div>';
if(q)h+='<div class="q">你说：'+esc(q)+'</div>';
h+='<div class="face">'+rich(now.face)+'</div>';
if(now.all.length>1){
h+='<button class="more" id="more" aria-expanded="false">看那天他回的全部话 ▾</button><div class="full hidden" id="full"><h4>那天他回给大家的话</h4>'
+now.groups.map(function(g){return '<div class="bub">'+g.lines.map(function(l){return '<p>'+rich(l)+'</p>';}).join('')+'</div>';}).join('')+'</div>';
}
if(done)h+='<div class="end">四个月的橙子，都摘完啦。<br>不是抛弃，是来日方长。</div>';
$('tx').innerHTML=h;
$('card').classList.toggle('gold',now.gold);
var mb=$('more');
if(mb)mb.onclick=function(){var hid=$('full').classList.toggle('hidden');mb.textContent=hid?'看那天他回的全部话 ▾':'收起 ▴';mb.setAttribute('aria-expanded',String(!hid));};
$('tx').scrollTop=0;
$('bAgain').classList.toggle('hidden',review);
var c=$('card');c.style.animation='none';void c.offsetWidth;c.style.animation='';
show('resov');
}

/* 图鉴 */
function renderAlbum(){
$('alabel').textContent=st.collected.length+' / '+N+' 已收集';
$('grid').innerHTML=days.map(function(d){
var got=st.collected.indexOf(d.id)>=0;
var svg='<svg viewBox="-56 -66 112 116" aria-hidden="true"><use href="#o"/></svg>';
return got?'<button class="cell'+(d.gold?' g':'')+'" data-id="'+d.id+'" aria-label="'+fmt(d.id)+'">'+svg+'<span>'+fmt(d.id)+'</span></button>'
:'<div class="cell lk">'+svg+'</div>';
}).join('');
}
$('grid').addEventListener('click',function(e){var b=e.target.closest('button.cell');if(b)showResult(b.dataset.id,true,false);});
$('bAlbum').onclick=function(){hide('home');show('album');renderAlbum();};
$('back').onclick=function(){hide('album');show('home');};

/* 保存图片：自己用 canvas 画，不依赖任何外部脚本 */
function makeImage(d){
var W=750,P=56,IN=48,fs=38,lh=64,tw=W-2*(P+IN);
var c=document.createElement('canvas'),x=c.getContext('2d');
x.font=fs+'px '+FONT;
var rows=[];
[d.face].forEach(function(l){
var s='';
for(var i=0;i<l.length;i++){
if(x.measureText(s+l[i]).width>tw){rows.push({t:s});s=l[i];}else s+=l[i];
}
rows.push({t:s,gap:16});
});
var top=P+IN,head=96,H=top+head+rows.reduce(function(a,r){return a+lh+(r.gap||0);},0)+IN+70+P;
c.width=W;c.height=H;
x.fillStyle='#F6EAD3';x.fillRect(0,0,W,H);
x.fillStyle='#FFFBF1';x.beginPath();(x.roundRect||x.rect).call(x,P,P,W-2*P,H-2*P,14);x.fill();
x.fillStyle=d.gold?'#F2CB5C':'#F4A23C';x.strokeStyle=d.gold?'#C8962A':'#E97A1F';x.lineWidth=3;
x.beginPath();x.arc(P+IN+22,top+30,22,0,7);x.fill();x.stroke();
x.fillStyle='#8FAE68';x.beginPath();x.ellipse(P+IN+34,top+2,14,7,-.5,0,7);x.fill();
x.textBaseline='middle';x.font='bold 42px '+FONT;x.fillStyle=d.gold?'#C8962A':'#E97A1F';
x.fillText(fmt(d.id),P+IN+58,top+30);
x.strokeStyle='#EADFC4';x.lineWidth=2;x.beginPath();x.moveTo(P+IN,top+head-16);x.lineTo(W-P-IN,top+head-16);x.stroke();
x.font=fs+'px '+FONT;x.fillStyle='#4B3A29';
var y=top+head+lh/2;
rows.forEach(function(r){x.fillText(r.t,P+IN,y);y+=lh+(r.gap||0);});
x.textAlign='center';x.font='24px '+FONT;x.fillStyle='#A8957A';
x.fillText('大成的 Fromm 留言筐',W/2,H-P-IN/2-8);
return c.toDataURL('image/png');
}

['resov','aboutov','imgov'].forEach(function(id){
$(id).addEventListener('click',function(e){if(e.target===this)hide(id);});
});
document.addEventListener('keydown',function(e){
if(e.key!=='Escape')return;
['imgov','aboutov','resov'].some(function(id){if(!$(id).classList.contains('hidden')){hide(id);return true;}});
});
count();
})();
